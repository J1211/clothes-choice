name: Daily Wardrobe & Sneaker AI Update

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 UTC+8 09:00 自动运行
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch brands, Shanghai weather & Run AI Buyer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/fetch_and_eval.py

      - name: Commit data/items.json (Anti-bloat amend)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an' || echo "")
          if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
            echo "Amending previous bot commit to prevent repo bloat..."
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "chore: update AI menswear & sneaker selections"
            git push
          fi
